name: GrandStay HMS Continuous Integration

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-lint-and-typecheck:
    name: Code Quality & Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Strict Check
        run: npm run lint

  automated-test-suite:
    name: Vitest Comprehensive Test Suite (184 Tests)
    runs-on: ubuntu-latest
    needs: quality-lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run All Domain & Invariant Test Suites
        env:
          NODE_ENV: test
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci_pipeline
        run: npm test

  production-build-verification:
    name: Vite Production Bundle Build
    runs-on: ubuntu-latest
    needs: quality-lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vite Build
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -d dist/assets || exit 1
          echo "Production build output verified successfully."

  container-build-verification:
    name: Docker Multi-Stage Container Build
    runs-on: ubuntu-latest
    needs: [automated-test-suite, production-build-verification]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build GrandStay Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: grandstay/hms-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
