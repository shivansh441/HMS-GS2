name: GrandStay HMS CI Pipeline

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Typing & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: ruff check app tests

      - name: Run Ruff Format Check
        run: ruff format --check app tests

      - name: Run Mypy Type Checking
        run: PYTHONPATH=. mypy --config-file pyproject.toml app

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_min_32_characters_for_ci
        run: pytest -v

  frontend-quality-and-build:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Run Vite Production Build
        run: npm run build
