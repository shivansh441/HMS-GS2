# Docker Compose for GrandStay Hybrid Hostel-cum-Hotel Management System (Development & Self-Hosted)
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: grandstay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grandstay_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GrandStay_2026_SecureDev!}
      POSTGRES_DB: ${POSTGRES_DB:-grandstay_hms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-grandstay_admin} -d $${POSTGRES_DB:-grandstay_hms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grandstay_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grandstay_app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-grandstay_admin}:${POSTGRES_PASSWORD:-GrandStay_2026_SecureDev!}@db:5432/${POSTGRES_DB:-grandstay_hms}"
      SECRET_KEY: ${SECRET_KEY:-8bfaaccd12c436ab89ae60ddfd8a5ab02267fc4b5f45f0616fe678967c909174}
      VITE_API_BASE_URL: "/api/v1"
      VITE_APP_NAME: "GrandStay Hybrid HMS"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - grandstay_network

volumes:
  postgres_data:
    driver: local

networks:
  grandstay_network:
    driver: bridge
