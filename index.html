<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrandStay - Hybrid Hostel & Hotel Enterprise Management System</title>
    <meta name="description" content="Production-grade multi-property management platform supporting unified administrative operations, distinct hostel and hotel business workflows, and property-isolated security." />
    <meta property="og:title" content="GrandStay - Hybrid Hostel & Hotel Enterprise Management System" />
    <meta property="og:description" content="Production-grade multi-property management platform supporting unified administrative operations, distinct hostel and hotel business workflows, and property-isolated security." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('grandstay_theme_mode') || 'dark';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
